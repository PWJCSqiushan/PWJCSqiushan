<svg width="1200" height="360" viewBox="0 0 1200 360"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#080B16"/>

<stop offset="100%"
stop-color="#111827"/>

</linearGradient>


<linearGradient id="line"
x1="0"
y1="0"
x2="1"
y2="0">

<stop offset="0%"
stop-color="#22D3EE"/>

<stop offset="100%"
stop-color="#6366F1"/>

</linearGradient>


<filter id="glow">

<feGaussianBlur
stdDeviation="4"
result="coloredBlur"/>

<feMerge>

<feMergeNode in="coloredBlur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>


</defs>


<!-- Background -->

<rect
width="1200"
height="360"
fill="url(#bg)"
rx="20"/>


<!-- Grid -->

<g opacity="0.12"
stroke="#94A3B8">

<path d="M0 80 H1200"/>

<path d="M0 160 H1200"/>

<path d="M0 240 H1200"/>

<path d="M200 0 V360"/>

<path d="M400 0 V360"/>

<path d="M600 0 V360"/>

<path d="M800 0 V360"/>

<path d="M1000 0 V360"/>

</g>


<!-- System Network -->

<g
stroke="url(#line)"
stroke-width="2"
fill="none"
opacity="0.8">

<path d="
220 180
L420 100
L600 180
L780 100
L980 180
"/>


<path d="
420 100
L420 260
"/>


<path d="
600 180
L600 300
"/>


<path d="
780 100
L780 260
"/>


</g>


<!-- Nodes -->

<g
fill="#22D3EE"
filter="url(#glow)">

<circle cx="220"
cy="180"
r="8"/>

<circle cx="420"
cy="100"
r="8"/>

<circle cx="600"
cy="180"
r="10"/>

<circle cx="780"
cy="100"
r="8"/>

<circle cx="980"
cy="180"
r="8"/>

</g>


<!-- Labels -->


<g
font-family="Arial, sans-serif"
fill="#E5E7EB">


<text
x="160"
y="220"
font-size="18">

AI

</text>


<text
x="365"
y="75"
font-size="18">

Automation

</text>


<text
x="530"
y="220"
font-size="22"
font-weight="bold">

SYSTEM

</text>


<text
x="735"
y="75"
font-size="18">

Product

</text>


<text
x="930"
y="220"
font-size="18">

Human

</text>


</g>



<!-- Main Title -->


<text
x="600"
y="330"
text-anchor="middle"
font-family="Arial, sans-serif"
font-size="28"
font-weight="bold"
fill="#FFFFFF">

Qiu Shan Lab · Building Intelligent Systems

</text>


</svg>
